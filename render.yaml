services:
  - type: web
    name: authentichain
    runtime: docker
    plan: free
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://authentichain.website
      - key: FRONTEND_ORIGIN
        value: https://admin.authentichain.website
      - key: FRONTEND_ORIGINS
        value: https://admin.authentichain.website,https://authentichain-dashboard.onrender.com
      - key: HSM_BASE_URL
        value: https://authentichain-hsm.onrender.com
      - key: NFC_BLOCKED_SOURCE_IPS
        value: 74.125.208.230
      - key: HSM_SERVICE_TOKEN
        sync: false
      - key: GEOIP_LICENSE_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: product-auth-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: product-auth-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: product-auth-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: product-auth-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: product-auth-db
          property: password
  - type: web
    name: authentichain-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://authentichain.website
  - type: web
    name: authentichain-product-site
    runtime: static
    rootDir: product-site
    buildCommand: echo "Publishing AuthentiChain product site"
    staticPublishPath: .
  - type: web
    name: authentichain-hsm
    runtime: python
    plan: free
    rootDir: tools/hsm-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HSM_SERVICE_TOKEN
        sync: false
      - key: HSM_DB_HOST
        fromDatabase:
          name: product-auth-db
          property: host
      - key: HSM_DB_PORT
        fromDatabase:
          name: product-auth-db
          property: port
      - key: HSM_DB_NAME
        fromDatabase:
          name: product-auth-db
          property: database
      - key: HSM_DB_USER
        fromDatabase:
          name: product-auth-db
          property: user
      - key: HSM_DB_PASSWORD
        fromDatabase:
          name: product-auth-db
          property: password

databases:
  - name: product-auth-db
    databaseName: product_auth
    user: product_auth
    plan: free
