spring:
  application:
    name: product-auth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:product_auth}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

app:
  public-base-url: ${PUBLIC_BASE_URL:}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  hsm:
    base-url: ${HSM_BASE_URL:}
    service-token: ${HSM_SERVICE_TOKEN:}

logging:
  level:
    com.example.productauth: INFO
